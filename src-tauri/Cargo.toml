[package]
name = "openleaguemanager"
version = "2026.1111.2"
description = "Open League Manager"
authors = ["KOI Noboris Development Team <noboriskoi@gmail.com>"]
repository = "https://github.com/OpenLeagueManager/OLManager"
edition = "2021"
default-run = "openleaguemanager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "olmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/olm_core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
olm_core = { path = "crates/olm_core" }
chrono = "0.4.44"
rand = "0.10"
base64 = "0.22"
zip = "2"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
dirs = "6"
thiserror = "2"
validator = { version = "0.19", features = ["derive"] }
ts-rs = { version = "10", optional = true, features = ["serde-compat"] }
discord-rich-presence = "1.1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-process = "~2.3.1"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", default-features = false }

[features]
typescript = ["ts-rs", "olm_core/typescript"]

# The seeded full-match simulation tests in olm_core take over a minute at
# opt-level 0; level 2 keeps debug assertions and symbols but runs them ~10x faster.
[profile.dev.package.olm_core]
opt-level = 2
